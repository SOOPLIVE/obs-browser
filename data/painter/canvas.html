<!DOCTYPE html>
<html>

<head>
    <title>FreecShot Painter</title>
    <style type="text/css">
        body {
            overflow: hidden;
            padding : 0;
            margin : 0;
        }
        
        #overlay {
            position: fixed;
            display: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(75, 60, 72, 0);
            z-index: 2;
            cursor: pointer;
        }

        #text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 50px;
            color: white;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
        }
    </style>

    <script src="./canvas.js"></script>
    <script src="canvasHistory.js"></script>
</head>

<body oncontextmenu='return false'>
    <div id="container" >
        <canvas id="afcanvas"></canvas>
    </div>
</body>

</html>
